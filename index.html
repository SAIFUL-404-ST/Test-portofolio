<!DOCTYPE html>
<html lang="en" data-mode="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080808">
<title>Mohammad Saiful Islam | Elite Profile</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#ffd700;--fire1:#ff6600;--fire2:#ff9900;--fire3:#ffcc00;
  --bg:#080808;--card:#111111;--text:#ffffff;
  --danger:#ff416c;--success:#25D366;--warning:#ffa726;
  --card-bg:linear-gradient(160deg,rgba(18,18,18,0.97),rgba(8,8,8,0.97));
  --info-bg:rgba(255,215,0,0.04);--info-border:rgba(255,215,0,0.12);
  --value-color:#fff;--label-opacity:.55;
  --nav-bg:rgba(8,8,8,0.85);
  --input-bg:rgba(255,255,255,0.06);--input-color:#fff;
  --footer-bg:rgba(0,0,0,0.5);--footer-border:rgba(255,215,0,0.15);
  --mikasa-bg:linear-gradient(135deg,rgba(255,215,0,0.08),rgba(255,102,0,0.04));
  --r1:12px;--r2:18px;--r3:28px;
  --body-font:'Outfit',system-ui,sans-serif;
  --display:'Syne','Outfit',sans-serif;
  --w:520px;
}
html[data-mode="light"]{
  --bg:#f0f0f0;--card:#fff;--text:#111;
  --card-bg:linear-gradient(160deg,rgba(255,255,255,0.98),rgba(245,245,245,0.98));
  --info-bg:rgba(255,150,0,0.05);--info-border:rgba(255,150,0,0.18);
  --value-color:#111;--label-opacity:.5;
  --nav-bg:rgba(245,245,245,0.88);
  --input-bg:rgba(255,255,255,0.9);--input-color:#111;
  --footer-bg:rgba(0,0,0,0.06);--footer-border:rgba(255,150,0,0.2);
  --mikasa-bg:linear-gradient(135deg,rgba(255,150,0,0.08),rgba(255,200,0,0.04));
}
*{margin:0;padding:0;box-sizing:border-box;font-family:var(--body-font)}
body{background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;transition:background .4s,color .4s}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
a{color:var(--gold);text-decoration:none}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(255,215,0,0.25);border-radius:99px}

/* TOP NAV */
.top-nav{position:fixed;top:0;left:0;right:0;height:64px;background:var(--nav-bg);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-bottom:1px solid rgba(255,215,0,0.1);display:flex;align-items:center;justify-content:space-between;padding:0 14px;z-index:900}
.left-controls{display:flex;gap:8px;align-items:center}
.ctrl-btn{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:1.5px solid rgba(255,215,0,0.2);background:rgba(255,215,0,0.06);backdrop-filter:blur(10px);color:var(--text);font-size:1.05rem;transition:all .3s;text-decoration:none}
.ctrl-btn:hover{transform:scale(1.1);border-color:var(--gold);box-shadow:0 0 18px rgba(255,215,0,0.3)}
.ctrl-btn i{color:var(--gold)}
.ctrl-btn.admin i{color:#ff9900}
.ctrl-btn.on{background:rgba(255,215,0,0.14);border-color:var(--gold)}
.nav-logo{font-family:var(--display);font-weight:800;font-size:1rem;background:linear-gradient(90deg,var(--gold),var(--fire2),var(--gold));background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 3s linear infinite;letter-spacing:1px}
@keyframes shine{to{background-position:200% center}}
.hamburger-btn{width:42px;height:42px;border-radius:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;border:1.5px solid rgba(255,215,0,0.25);background:rgba(255,215,0,0.07);backdrop-filter:blur(10px);color:var(--text);font-size:1.1rem;transition:all .3s}
.hamburger-btn:hover{border-color:var(--gold);box-shadow:0 0 18px rgba(255,215,0,0.3)}
.hamburger-btn i{color:var(--gold)}

/* DROPDOWN */
.dropdown-menu{position:fixed;top:74px;right:14px;background:rgba(10,10,10,0.96);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1.5px solid rgba(255,215,0,0.2);border-radius:18px;padding:10px;min-width:200px;z-index:9000;box-shadow:0 20px 60px rgba(0,0,0,.7);display:none;flex-direction:column;gap:4px;animation:menuSlide .25s cubic-bezier(.175,.885,.32,1.275)}
html[data-mode="light"] .dropdown-menu{background:rgba(250,250,250,0.97)}
.dropdown-menu.open{display:flex}
@keyframes menuSlide{from{opacity:0;transform:translateY(-12px) scale(.95)}to{opacity:1;transform:none}}
.dropdown-item{padding:12px 16px;border-radius:12px;cursor:pointer;display:flex;align-items:center;gap:12px;font-weight:700;font-size:.9rem;color:var(--text);transition:all .2s;border:1px solid transparent;text-decoration:none}
.dropdown-item:hover,.dropdown-item.active{background:rgba(255,215,0,0.1);border-color:rgba(255,215,0,0.25);color:var(--gold)}
.dropdown-item i{width:20px;text-align:center;color:var(--gold)}
.dropdown-divider{height:1px;background:rgba(255,215,0,0.1);margin:4px 0}

/* POPUP */
#namePopup{position:fixed;inset:0;background:rgba(8,8,8,0.98);z-index:9999;display:none;align-items:center;justify-content:center;backdrop-filter:blur(28px)}
.popup-card{background:linear-gradient(160deg,rgba(20,20,20,0.99),rgba(10,10,10,0.99));padding:38px;border-radius:28px;border:1.5px solid rgba(255,215,0,0.3);text-align:center;width:90%;max-width:400px;box-shadow:0 20px 70px rgba(255,102,0,0.25);animation:popupFireGlow 2s infinite alternate;position:relative;z-index:10000}
html[data-mode="light"] .popup-card{background:rgba(255,255,255,0.99)}
@keyframes popupFireGlow{from{box-shadow:0 20px 60px rgba(255,102,0,0.2)}to{box-shadow:0 20px 80px rgba(255,102,0,0.4)}}
.popup-card h2{color:var(--gold);font-family:var(--display);font-size:1.7rem;margin-bottom:6px}
.popup-card p{font-size:.88rem;opacity:.75;margin-bottom:5px}

/* INPUT */
input,textarea,select{width:100%;padding:13px 15px;margin:8px 0;border-radius:13px;border:1.5px solid rgba(255,215,0,0.2);background:var(--input-bg);color:var(--input-color);outline:none;font-size:.92rem;font-family:inherit;transition:all .3s}
input:focus,textarea:focus,select:focus{border-color:var(--gold);box-shadow:0 0 20px rgba(255,215,0,0.18)}
input::placeholder,textarea::placeholder{color:var(--text);opacity:.35}
textarea{resize:vertical}

/* BUTTONS */
.btn{padding:12px 22px;border-radius:13px;border:0;cursor:pointer;font-weight:900;font-size:.86rem;display:inline-flex;align-items:center;justify-content:center;gap:8px;letter-spacing:.5px;transition:all .3s;font-family:inherit}
.btn:hover{transform:translateY(-3px);box-shadow:0 10px 25px rgba(0,0,0,.35)}
.btn.primary{background:linear-gradient(135deg,var(--fire1),var(--fire2));color:#160800;width:100%}
.btn.ghost{background:transparent;border:1.5px solid var(--line, rgba(255,215,0,0.25));color:var(--text)}

/* VIEW */
#view{position:relative;z-index:1;padding:80px 14px 60px}
.page{max-width:var(--w);margin:0 auto;animation:pg .28s ease-out}
@keyframes pg{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.page-err{padding:30px 20px;border-radius:var(--r3);background:var(--card-bg);border:1px dashed rgba(255,215,0,0.2);text-align:center}
.page-err i{font-size:1.6rem;color:var(--gold);margin-bottom:10px;display:block}
.page-err h3{margin-bottom:6px}
.page-err p{opacity:.7;font-size:.9rem;word-break:break-word}

/* NOTIFICATION */
#notificationArea{position:fixed;top:80px;right:14px;z-index:999999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.notification{pointer-events:auto;padding:13px 20px;border-radius:13px;background:var(--card);border:1.5px solid rgba(255,215,0,0.3);box-shadow:0 10px 30px rgba(0,0,0,.6);display:flex;align-items:center;gap:12px;transform:translateX(140%);transition:transform .45s cubic-bezier(.68,-.55,.265,1.55);color:var(--text);max-width:320px}
.notification.show{transform:translateX(0)}
.notification i{font-size:1.2rem}

/* GLOBALS HOST */
#globals{position:fixed;inset:0;pointer-events:none;z-index:0}

/* CARD (home) */
.card{background:var(--card-bg);border-radius:36px;padding:16px 24px 36px;text-align:center;box-shadow:0 40px 120px rgba(0,0,0,.9),0 0 0 1px rgba(255,215,0,0.1);position:relative;backdrop-filter:blur(20px);border:1px solid rgba(255,215,0,0.12);overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--fire1),var(--gold),var(--fire2),var(--fire1),transparent);background-size:200% auto;animation:shine 2.5s linear infinite,fireFlicker 1.8s ease-in-out infinite alternate}
@keyframes fireFlicker{0%{opacity:.5}25%{opacity:1}50%{opacity:.7}75%{opacity:1}100%{opacity:.6}}
.card-cover{position:relative;width:calc(100% + 48px);margin:-16px -24px 0;height:140px;overflow:hidden;border-radius:36px 36px 0 0}
.card-cover img{width:100%;height:100%;object-fit:cover;filter:brightness(.75) saturate(1.2)}
.card-cover::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,rgba(255,80,0,0.15),rgba(8,8,8,0.85))}
html[data-mode="light"] .card-cover::after{background:linear-gradient(to bottom,rgba(255,80,0,0.1),rgba(240,240,240,0.85))}
.avatarBox{position:relative;width:150px;height:150px;margin:-75px auto 0;z-index:10}
.fire-ring{position:absolute;inset:-16px;border-radius:50%;background:conic-gradient(from 0deg,#ff2200,#ff6600,#ffaa00,#ffdd00,#ffaa00,#ff6600,#ff2200);animation:ringRotate 2s linear infinite,fireRingFlicker 1.2s ease-in-out infinite alternate;z-index:-1;filter:blur(3px)}
.fire-ring-2{position:absolute;inset:-9px;border-radius:50%;background:conic-gradient(from 180deg,#ff6600,#ffcc00,#ff3300,#ffcc00,#ff6600);animation:ringRotate 1.4s linear infinite reverse,fireRingFlicker2 .9s ease-in-out infinite alternate;z-index:-1;filter:blur(1.5px);opacity:.7}
.fire-ring-3{position:absolute;inset:-4px;border-radius:50%;background:var(--bg);z-index:-1;transition:background .4s}
@keyframes ringRotate{to{transform:rotate(360deg)}}
@keyframes fireRingFlicker{0%{opacity:.75;filter:blur(2px) brightness(.9)}30%{opacity:1;filter:blur(4px) brightness(1.3)}60%{opacity:.85;filter:blur(2.5px) brightness(1)}100%{opacity:1;filter:blur(3.5px) brightness(1.4)}}
@keyframes fireRingFlicker2{0%{opacity:.5}40%{opacity:.8}100%{opacity:.6}}
.avatarBox::after{content:'';position:absolute;inset:-35px;border-radius:50%;background:radial-gradient(circle,rgba(255,102,0,0.35),rgba(255,200,0,0.15),transparent 65%);animation:avatarFireAura 1.5s ease-in-out infinite alternate;z-index:-2}
@keyframes avatarFireAura{0%{opacity:.3;transform:scale(.88)}50%{opacity:.9;transform:scale(1.08)}100%{opacity:.6;transform:scale(1)}}
.avatar{width:100%;height:100%;border-radius:50%;object-fit:cover;border:3px solid rgba(255,200,0,0.65);box-shadow:0 0 30px rgba(255,102,0,0.6);animation:avatarFireGlow 1.6s ease-in-out infinite alternate}
@keyframes avatarFireGlow{0%{box-shadow:0 0 25px rgba(255,80,0,0.4)}33%{box-shadow:0 0 50px rgba(255,120,0,0.9)}66%{box-shadow:0 0 35px rgba(255,60,0,0.55)}100%{box-shadow:0 0 55px rgba(255,150,0,1)}}
.card h1{margin-top:12px;font-family:var(--display);font-size:1.95rem;font-weight:800;letter-spacing:-.5px;background:linear-gradient(90deg,var(--fire1),var(--gold),#fff,var(--gold),var(--fire1));background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 3s linear infinite;overflow-wrap:anywhere}
html[data-mode="light"] .card h1{background:linear-gradient(90deg,var(--fire1),#aa6600,#111,#aa6600,var(--fire1));background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent}
.profile-badge{margin:12px 0;padding:9px 24px;border-radius:50px;font-size:.8rem;font-weight:900;border:1.5px solid rgba(255,215,0,0.35);background:linear-gradient(135deg,rgba(255,102,0,0.12),rgba(255,215,0,0.08));display:inline-block;color:var(--text);box-shadow:0 0 18px rgba(255,102,0,0.15)}
.quote{font-style:italic;font-size:.78rem;opacity:.8;margin-bottom:16px;padding:0 16px;color:var(--text)}
.section-title{font-size:.78rem;color:var(--gold);font-weight:900;text-transform:uppercase;margin:26px 0 13px;text-align:left;padding-left:12px;letter-spacing:2px;border-left:3px solid var(--fire2);display:flex;align-items:center;gap:10px}
.section-title::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(255,215,0,0.3),transparent)}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:left}
.info{background:var(--info-bg);padding:13px;border-radius:13px;border:1px solid var(--info-border);transition:all .3s;position:relative;overflow:hidden}
.info:hover{border-color:rgba(255,215,0,0.4);background:rgba(255,215,0,0.07);transform:translateY(-3px)}
.info i{color:var(--gold);margin-right:8px;font-size:.85rem}
.label{display:block;font-size:.57rem;opacity:var(--label-opacity);font-weight:900;letter-spacing:1px;margin-bottom:4px;color:var(--text)}
.value{font-size:.82rem;font-weight:700;color:var(--value-color)}
.mikasa{margin-top:22px;padding:20px;border-radius:20px;background:var(--mikasa-bg);border:1.5px solid rgba(255,215,0,0.2);text-align:left;backdrop-filter:blur(10px)}
.mikasaHead{display:flex;gap:13px;align-items:center;margin-bottom:12px}
.mikasaHead img{width:56px;height:56px;border-radius:50%;border:2px solid var(--gold);box-shadow:0 0 20px rgba(255,102,0,0.45)}
.mikasaHead h3{font-size:.95rem;color:var(--gold);font-weight:900}
.mikasaHead p{font-size:.68rem;opacity:.7;margin:0}
.mikasa .text{font-size:.8rem;line-height:1.65;opacity:.85;margin-bottom:13px;color:var(--text)}
.mkbtn{display:inline-flex;align-items:center;gap:8px;margin-top:10px;background:linear-gradient(135deg,var(--fire1),var(--fire2));color:#160800;padding:10px 18px;border-radius:11px;text-decoration:none;font-weight:900;font-size:.78rem;transition:all .3s}
.mkbtn:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(255,102,0,0.45)}
.social{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:20px}
.social a{height:48px;border-radius:13px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.2rem;transition:all .3s;text-decoration:none}
.social a:hover{transform:translateY(-5px);box-shadow:0 10px 25px rgba(0,0,0,.4)}
.fb{background:linear-gradient(135deg,#1877f2,#0d5fcc)}
.wa{background:linear-gradient(135deg,#25d366,#1ea952)}
.ig{background:linear-gradient(135deg,#e4405f,#c13584)}
.mail{background:linear-gradient(135deg,#ea4335,#d02c1e)}
.footer{margin-top:24px;font-size:.65rem;opacity:.55;font-weight:900;letter-spacing:2px;text-transform:uppercase;padding:13px;background:var(--footer-bg);border-radius:13px;border:1px solid var(--footer-border);color:var(--text)}
.visitor-box{margin-top:26px;padding:13px;background:var(--info-bg);border-radius:16px;border:1.5px solid var(--info-border)}
.visitor-box p{font-size:.8rem;font-weight:800;display:flex;align-items:center;justify-content:center;gap:10px;color:var(--text)}
.visitor-box i{color:var(--gold);font-size:1.1rem}
.visitor-box span{color:var(--gold);font-size:1.45rem;font-weight:900}

/* CONTACT */
.contact-link{display:flex;align-items:center;gap:15px;padding:16px 17px;border-radius:16px;border:1px solid rgba(255,215,0,0.12);background:var(--info-bg);text-decoration:none;color:var(--text);margin-bottom:10px;transition:all .3s}
.contact-link:hover{border-color:rgba(255,215,0,0.35);background:rgba(255,215,0,0.07);transform:translateX(5px)}
.c-icon{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.15rem;flex-shrink:0}
.c-label{font-size:.6rem;opacity:.55;font-weight:900;letter-spacing:1px;text-transform:uppercase;display:block;margin-bottom:3px}
.c-value{font-size:.86rem;font-weight:700}

/* STORIES */
.story-card{padding:16px;background:var(--card-bg);border-radius:16px;border-left:3px solid var(--gold);margin-bottom:16px;color:var(--text);border-top:1px solid rgba(255,215,0,0.1);border-right:1px solid rgba(255,215,0,0.1);border-bottom:1px solid rgba(255,215,0,0.1)}
.story-card p{font-size:.88rem;line-height:1.7}
.react-box{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
.react-btn{background:rgba(255,215,0,0.08);border:1px solid rgba(255,215,0,0.2);border-radius:16px;padding:5px 12px;cursor:pointer;font-size:.82rem;color:var(--text);transition:all .2s}
.react-btn:hover{background:rgba(255,215,0,0.18);transform:scale(1.08)}
.spinner{width:44px;height:44px;border:4px solid rgba(255,215,0,0.1);border-left-color:var(--gold);border-radius:50%;animation:spin 1s linear infinite;margin:18px auto}
@keyframes spin{to{transform:rotate(360deg)}}

/* TOOLS ZONE */
#toolsPluginZone{display:flex;flex-direction:column;gap:20px}

@media(min-width:900px){
  :root{--w:640px}
  #view{padding:90px 20px 60px}
}
@media(max-width:480px){
  .card{border-radius:26px;padding:14px 16px 30px}
  .card-cover{width:calc(100% + 32px);margin:-14px -16px 0;height:120px}
  .card h1{font-size:1.6rem}
  .info-grid{grid-template-columns:1fr}
  .avatarBox{width:130px;height:130px;margin-top:-65px}
}
</style>
</head>

  var icons={success:'check-circle',error:'exclamation-circle',info:'info-circle'};
  var n=document.createElement('div');n.className='notification';
  n.innerHTML='<i class="fas fa-'+(icons[type]||'info-circle')+'" style="color:'+(colors[type]||colors.info)+'"></i><div style="font-size:.85rem">'+esc(String(msg).replace(/<[^>]*>/g,''))+'</div>';
  area.appendChild(n);
  setTimeout(function(){n.classList.add('show')},10);
  setTimeout(function(){n.classList.remove('show');setTimeout(function(){n.remove()},500)},4200);
}

/* Theme + style API */
var BRAND_DEFAULT='SAIF ELITE';
function applyTheme(o){
  var r=document.documentElement;
  if(!o){r.dataset.mode='dark';$('#navBrand').textContent=BRAND_DEFAULT;$('#btnTheme').hidden=true;return}
  $('#navBrand').textContent=o.brand||BRAND_DEFAULT;
  document.title=(o.brand||BRAND_DEFAULT)+' | Elite Profile';
  if(o.vars){var v=o.vars;['gold','fire1','fire2','bg','card','text'].forEach(function(k){if(v[k])r.style.setProperty('--'+k,v[k])})}
  var m=o.mode||'dark';
  if(m==='auto')m=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';
  var saved=null;try{saved=localStorage.getItem('saifTheme')}catch(e){}
  if(saved==='light'||saved==='dark')m=saved;
  r.dataset.mode=m;
  $('#btnTheme').hidden=o.toggle===false;
  var ic=$('#themeIcon');if(ic)ic.className='fas '+(m==='light'?'fa-sun':'fa-moon');
  var meta=$('meta[name=theme-color]');
  if(meta)meta.setAttribute('content',getComputedStyle(r).getPropertyValue('--bg').trim()||'#080808');
}
function resetTheme(){
  var r=document.documentElement;
  ['--gold','--fire1','--fire2','--bg','--card','--text'].forEach(function(k){r.style.removeProperty(k)});
  r.dataset.mode='dark';$('#navBrand').textContent=BRAND_DEFAULT;$('#btnTheme').hidden=true;
}
function applyStyle(o){
  var r=document.documentElement;
  if(!o){['--body-font','--display','--r1','--r2','--r3','--w'].forEach(function(k){r.style.removeProperty(k)});return}
  var fam=function(f){return f?"'"+f+"',system-ui,sans-serif":null};
  if(o.bodyFont&&o.bodyFont!=='system')r.style.setProperty('--body-font',fam(o.bodyFont));
  if(o.displayFont&&o.displayFont!=='system')r.style.setProperty('--display',fam(o.displayFont)+',Outfit,sans-serif');
  var map={sharp:['6px','10px','14px'],soft:['12px','18px','28px'],round:['18px','26px','36px']},rr=map[o.roundness]||map.soft;
  r.style.setProperty('--r1',rr[0]);r.style.setProperty('--r2',rr[1]);r.style.setProperty('--r3',rr[2]);
  var w={narrow:'480px',normal:'520px',wide:'720px'}[o.width]||'520px';
  r.style.setProperty('--w',w);
}
function resetStyle(){['--body-font','--display','--r1','--r2','--r3','--w'].forEach(function(k){document.documentElement.style.removeProperty(k)})}
var siteAPI={setTheme:applyTheme,resetTheme:resetTheme,setStyle:applyStyle,resetStyle:resetStyle};

var MODS={},CODE={},nav=[],pageCtx=null,globalCtx={},currentRoute='',booted=false;

function makeCtx(id,meta,root){
  var clean=[];
  var ctx={
    meta:meta,root:root,host:root,
    settings:meta.settings||{},
    esc:esc,safeUrl:safeUrl,db:db,
    toast:function(m){toast(m,'info')},
    user:{name:getUser()},
    nav:nav,
    css:function(text){var st=document.createElement('style');st.setAttribute('data-mod',id);st.textContent=text;document.head.appendChild(st);clean.push(function(){st.remove()})},
    onDestroy:function(fn){clean.push(fn)}
  };
  ctx.site=siteAPI;
  ctx.__clean=clean;
  return ctx;
}
function destroyCtx(c){if(!c)return;(c.__clean||[]).forEach(function(f){try{f()}catch(e){console.warn(e)}})}
function showErr(r,e){console.error('[module]',e);r.innerHTML='<div class="page-err"><i class="fas fa-triangle-exclamation"></i><h3>This section could not load</h3><p>'+esc(e&&e.message?e.message:String(e))+'</p></div>'}
function execute(code,ctx){
  try{
    var fn=new Function('ctx','"use strict";return (async()=>{\n'+code+'\n})();');
    var p=fn(ctx);
    if(p&&typeof p.catch==='function')p.catch(function(e){showErr(ctx.root,e)});
  }catch(e){showErr(ctx.root,e)}
}
function normIcon(i){i=String(i||'fa-cube').trim();if(/\s/.test(i))return i;if(i.indexOf('fa-')!==0)i='fa-'+i;return'fas '+i}

function buildNav(){
  var pages=Object.keys(MODS).map(function(id){return Object.assign({id:id},MODS[id])}).filter(function(m){return m.enabled!==false&&(m.type||'page')==='page'}).sort(function(a,b){return (a.order||0)-(b.order||0)});
  nav=pages.map(function(m){return{id:m.id,route:m.route||m.id,title:m.title||m.id,icon:normIcon(m.icon),desc:m.desc||'',inNav:m.inNav!==false}});
  // dropdown
  var menu=$('#dropdownMenu');
  menu.innerHTML=nav.filter(function(n){return n.inNav}).map(function(n,i){
    return (i>0?'<div class="dropdown-divider"></div>':'')+'<a class="dropdown-item" data-route="'+esc(n.route)+'" href="#/'+esc(n.route)+'"><i class="'+esc(n.icon)+'"></i>'+esc(n.title)+'</a>';
  }).join('')||'<div style="padding:12px 16px;opacity:.6;font-size:.85rem">No pages yet.</div>';
}
function paintNav(){
  $$('#dropdownMenu .dropdown-item').forEach(function(a){a.classList.toggle('active',a.dataset.route===currentRoute)});
}
function resolve(route){
  route=String(route||'').replace(/^#\/?/,'').replace(/\/+$/,'');
  if(!route){var f=nav.find(function(n){return n.inNav})||nav[0];return f?f.route:''}
  var ex=nav.find(function(n){return n.route===route||n.id===route});return ex?ex.route:null;
}
function render(){
  var view=$('#view');
  var requested=resolve(location.hash);
  if(requested===null){
    if(pageCtx){destroyCtx(pageCtx);pageCtx=null}
    view.innerHTML='<div class="page"><div class="page-err"><i class="fas fa-compass"></i><h3>Page not found</h3><p>Address <b>#/'+esc(location.hash.replace(/^#\/?/,''))+'</b> does not exist.</p><p style="margin-top:14px"><a href="#/" style="display:inline-flex;padding:10px 18px;border-radius:12px;background:linear-gradient(135deg,var(--fire1),var(--fire2));color:#160800;font-weight:700">Go home</a></p></div></div>';
    currentRoute='';paintNav();return;
  }
  var found=nav.find(function(n){return n.route===requested});if(!found)return;
  var id=found.id,m=MODS[id];if(!m)return;
  currentRoute=requested;
  if(pageCtx){destroyCtx(pageCtx);pageCtx=null}
  view.innerHTML='';
  var root=document.createElement('div');root.className='page';view.appendChild(root);
  var meta=Object.assign({id:id},m);var ctx=makeCtx(id,meta,root);pageCtx=ctx;
  var code=CODE[id];
  if(code){execute(code,ctx)}
  else if(m.file){
    fetch(m.file+'?v='+Date.now())
      .then(function(r){if(!r.ok)throw new Error('File not found: '+m.file);return r.text()})
      .then(function(txt){execute(txt,ctx)})
      .catch(function(e){showErr(root,e)});
  } else {
    root.innerHTML='<div class="page-err"><i class="fas fa-cube"></i><h3>'+esc(m.title||id)+'</h3><p>No code yet.</p></div>';
  }
  paintNav();
  window.scrollTo(0,0);
}
function runGlobals(){
  var host=$('#globals');
  Object.keys(globalCtx).forEach(function(id){destroyCtx(globalCtx[id])});globalCtx={};
  if(SAFE)return;
  var list=Object.keys(MODS).map(function(id){return Object.assign({id:id},MODS[id])}).filter(function(m){return m.enabled!==false&&m.type==='global'}).sort(function(a,b){return (a.order||0)-(b.order||0)});
  list.forEach(function(m){
    var box=document.createElement('div');box.setAttribute('data-gmod',m.id);host.appendChild(box);
    var ctx=makeCtx(m.id,Object.assign({id:m.id},m),box);globalCtx[m.id]=ctx;
    var code=CODE[m.id];
    if(code){execute(code,ctx);return}
    if(m.file){
      fetch(m.file+'?v='+Date.now()).then(function(r){return r.ok?r.text():''}).then(function(t){if(t)execute(t,ctx)}).catch(function(){});
    }
  });
}
function rebuild(){
  buildNav();runGlobals();
  if(!location.hash){var f=nav.find(function(n){return n.inNav})||nav[0];if(f)location.replace('#/'+f.route)}
  render();
}

SITE.child('modules').on('value',function(snap){
  var val=snap.val();MODS={};
  if(val&&typeof val==='object'){Object.keys(val).forEach(function(id){MODS[id]=val[id]||{}})}
  else{Object.keys(DEFAULT_MODULES).forEach(function(id){MODS[id]=JSON.parse(JSON.stringify(DEFAULT_MODULES[id]))})}
  rebuild();
  if(!booted){booted=true}
},function(err){
  console.warn('[site/modules]',err);
  if(!booted){
    Object.keys(DEFAULT_MODULES).forEach(function(id){MODS[id]=JSON.parse(JSON.stringify(DEFAULT_MODULES[id]))});
    rebuild();booted=true;
  }
});

SITE.child('code').on('value',function(snap){
  var val=snap.val()||{},changed=false;
  Object.keys(val).forEach(function(id){if(typeof val[id]==='string'&&CODE[id]!==val[id]){CODE[id]=val[id];changed=true}});
  Object.keys(CODE).forEach(function(id){if(!(id in val)){delete CODE[id];changed=true}});
  if(changed&&booted){runGlobals();render()}
});

  else{a.pause();paintMusic()}

function paintMusic(){
  var a=$('#bgm'),ic=$('#musicIcon'),btn=$('#btnMusic');
  if(!a||!ic)return;
  var on=!a.paused;
  ic.className='fas '+(on?'fa-volume-high':'fa-volume-xmark');

}
