<!DOCTYPE html>
<html lang="en" data-mode="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0b0a">
<title>SAIF ELITE</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;800&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">

<style>
:root{--gold:#ffd700;--fire1:#ff6600;--fire2:#ff9900;--bg:#0c0b0a;--surface:#151312;--surface2:#1e1b19;--text:#f4f1ec;--muted:rgba(244,241,236,.6);--line:rgba(255,215,0,.16);--r1:12px;--r2:18px;--r3:26px;--body-font:'Outfit',system-ui,sans-serif;--display:'Syne','Outfit',sans-serif;--w:820px}
html[data-mode="light"]{--bg:#faf7f2;--surface:#fff;--surface2:#f1ece4;--text:#1b1713;--muted:rgba(27,23,19,.62);--line:rgba(0,0,0,.10)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--body-font);background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden;background-image:radial-gradient(900px 420px at 0% -10%,rgba(255,102,0,.09),transparent 60%);background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
a{color:var(--gold);text-decoration:none}
img{max-width:100%;display:block}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#boot{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:200}
.sk{width:min(92vw,420px);display:grid;gap:14px}
.sk i{width:96px;height:96px;border-radius:50%;margin:0 auto 6px;display:block;background:conic-gradient(from 0deg,var(--fire1),var(--gold),var(--fire1));-webkit-mask:radial-gradient(circle,transparent 44%,#000 46%);mask:radial-gradient(circle,transparent 44%,#000 46%);animation:spin 1.1s linear infinite}
.sk b,.sk span{display:block;height:12px;border-radius:8px;background:linear-gradient(90deg,var(--surface),var(--surface2),var(--surface));background-size:200% 100%;animation:sh 1.3s linear infinite}
.sk b{width:60%;height:20px;margin:0 auto}
.sk span{width:80%;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sh{to{background-position:-200% 0}}
#shell{min-height:100%;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:var(--w);margin:0 auto;width:100%;padding:11px 16px;display:flex;align-items:center;gap:12px}
.brand{font-family:var(--display);font-weight:800;font-size:1.06rem;letter-spacing:.02em;background:linear-gradient(90deg,var(--fire1),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.grow{flex:1}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--line);color:var(--text);background:transparent;font-size:.95rem;transition:border-color .2s,transform .15s}
.iconbtn:hover{border-color:var(--gold);transform:translateY(-1px)}
.layout{flex:1;max-width:var(--w);margin:0 auto;width:100%;display:flex;padding:0 16px}
.sidebar{display:none;width:236px;flex:none;padding:20px 16px 20px 0;position:sticky;top:56px;align-self:flex-start;max-height:calc(100vh - 76px);overflow:auto}
.view{flex:1;min-width:0;padding:20px 0 96px}
@media(min-width:900px){.sidebar{display:block}.view{padding-bottom:40px}.tabbar{display:none!important}}
.snav{display:grid;gap:6px}
.snav a{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;color:var(--text);font-weight:600;font-size:.94rem;border:1px solid transparent}
.snav a:hover{background:var(--surface)}
.snav a.on{background:linear-gradient(135deg,rgba(255,102,0,.16),rgba(255,153,0,.06));border-color:var(--line);color:var(--gold)}
.snav a i{width:24px;text-align:center;color:var(--gold);font-size:.95rem}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:45;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:stretch;gap:4px}
.tabbar a,.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border-radius:12px;color:var(--muted);font-size:.68rem;font-weight:600;min-width:0;text-align:center}
.tabbar a i,.tabbar button i{font-size:1.05rem}
.tabbar a.on,.tabbar button.on{color:var(--gold);background:rgba(255,153,0,.10)}
.tabbar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.sheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(3px)}
.sheet-box{position:relative;width:100%;max-height:76vh;overflow:auto;background:var(--surface);border-top-left-radius:26px;border-top-right-radius:26px;border:1px solid var(--line);border-bottom:0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.sheet-box h3{font-family:var(--display);font-size:1.05rem;margin-bottom:12px;color:var(--gold)}
.sheet-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sheet-grid a{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 8px;border-radius:16px;background:var(--surface2);border:1px solid var(--line);color:var(--text);font-size:.78rem;font-weight:600;text-align:center}
.sheet-grid a i{font-size:1.25rem;color:var(--gold)}
.sheet-grid a.on{border-color:var(--gold)}
.page{animation:pg .28s ease-out}
@keyframes pg{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.page-err{padding:26px;border-radius:var(--r2);background:var(--surface);border:1px dashed var(--line);text-align:center}
.page-err i{font-size:1.5rem;color:var(--gold);margin-bottom:10px;display:block}
.page-err h3{margin-bottom:6px}
.page-err p{color:var(--muted);font-size:.9rem;word-break:break-word}
#toast{position:fixed;left:50%;bottom:calc(78px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:120;max-width:min(92vw,440px);padding:12px 20px;border-radius:14px;background:var(--surface2);border:1px solid var(--line);box-shadow:0 12px 40px rgba(0,0,0,.5);font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .22s,transform .22s}
#toast.on{opacity:1;transform:translateX(-50%) translateY(-6px)}
@media(min-width:900px){#toast{bottom:24px}}
#globals{position:fixed;inset:0;pointer-events:none;z-index:0}
</style>
</head>

<script>
(function(){
'use strict';
var firebaseConfig={apiKey:"AIzaSyC3Kk8wYdOSvu3eZYLwH4-ebI77Q9dwmOY",authDomain:"saif-elite.firebaseapp.com",databaseURL:"https://saif-elite-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"saif-elite",storageBucket:"saif-elite.firebasestorage.app",messagingSenderId:"542024397008",appId:"1:542024397008:web:71f8bba53c2eec701d6ed5"};
firebase.initializeApp(firebaseConfig);
var db=firebase.database(),SITE=db.ref('site');

var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return [].slice.call((r||document).querySelectorAll(s))};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function safeUrl(u){if(!u)return'';u=String(u).trim();if(/^(https?:|mailto:|tel:|\/|#|data:image\/)/i.test(u))return u;return''}
var toastTimer;
function toast(m){var t=$('#toast');t.textContent=String(m).replace(/<[^>]*>/g,'');t.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('on')},4200)}

var BRAND_DEFAULT='SAIF ELITE',themeState={toggle:false};
function applyTheme(o){var r=document.documentElement;if(!o){r.dataset.mode='dark';$('#brand').textContent=BRAND_DEFAULT;$('#modeBtn').hidden=true;return}
  $('#brand').textContent=o.brand||BRAND_DEFAULT;document.title=(o.brand||BRAND_DEFAULT)+' — Mohammad Saiful Islam';
  if(o.vars){var v=o.vars;['gold','fire1','fire2','bg','surface','text'].forEach(function(k){if(v[k])r.style.setProperty('--'+k,v[k])})}
  var m=o.mode||'dark';if(m==='auto')m=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';
  var saved=null;try{saved=localStorage.getItem('themeMode')}catch(e){}
  if(saved)m=saved;r.dataset.mode=m;themeState.toggle=o.toggle!==false;
  $('#modeBtn').hidden=!themeState.toggle;
  $('#modeBtn').innerHTML='<i class="fas '+(m==='light'?'fa-sun':'fa-moon')+'"></i>';
  try{localStorage.setItem('themeMode',m)}catch(e){}
  var meta=$('meta[name=theme-color]');if(meta)meta.setAttribute('content',getComputedStyle(r).getPropertyValue('--bg').trim()||'#0c0b0a');
}
function resetTheme(){var r=document.documentElement;['--gold','--fire1','--fire2','--bg','--surface','--text'].forEach(function(k){r.style.removeProperty(k)});r.dataset.mode='dark';$('#brand').textContent=BRAND_DEFAULT;$('#modeBtn').hidden=true}
function applyStyle(o){var r=document.documentElement;if(!o){['--body-font','--display','--r1','--r2','--r3','--w'].forEach(function(k){r.style.removeProperty(k)});return}
  var fam=function(f){return f?"'"+f+"',system-ui,sans-serif":null};
  if(o.bodyFont&&o.bodyFont!=='system')r.style.setProperty('--body-font',fam(o.bodyFont));
  if(o.displayFont&&o.displayFont!=='system')r.style.setProperty('--display',fam(o.displayFont)+',Outfit,sans-serif');
  var map={sharp:['6px','10px','14px'],soft:['12px','18px','26px'],round:['18px','26px','34px']},rr=map[o.roundness]||map.soft;
  r.style.setProperty('--r1',rr[0]);r.style.setProperty('--r2',rr[1]);r.style.setProperty('--r3',rr[2]);
  var w={narrow:'640px',normal:'820px',wide:'1080px'}[o.width]||'820px';r.style.setProperty('--w',w);
}
function resetStyle(){['--body-font','--display','--r1','--r2','--r3','--w'].forEach(function(k){document.documentElement.style.removeProperty(k)})}
var siteAPI={setTheme:applyTheme,resetTheme:resetTheme,setStyle:applyStyle,resetStyle:resetStyle};

function srcOf(id){var el=document.getElementById('src-'+id);return el?el.textContent.replace(/^\n/,'').replace(/\s+$/,''):''}

var DEFAULT_MODULES={
  home:{title:'Home',route:'home',icon:'fa-house',type:'page',order:1,inNav:true,usesNav:true,enabled:true,source:'file',file:'sections/home.js',shadow:false,desc:'Profile and a shortcut to every page',schema:[],settings:{name:'MOHAMMAD SAIFUL ISLAM',badge:'Honours 2nd Year (Management)',quote:'Focus on your career, let the success make the noise.',cover:'https://i.imgur.com/zq5JFC5.jpeg',avatar:'https://i.imgur.com/58L6IZM.jpeg',nickname:'Saif',birthday:'25 January',status:'Study + Job',skills:'Bot & Web Hosting',hometown:'Gaibandha Sadar',current:'Gazipur, Dhaka',fb:'https://www.facebook.com/saiful.404.st',wa:'8801823772045',ig:'https://www.instagram.com/saiful_404_st',email:'saifmorse04@gmail.com',mikasaTitle:'Mikasa Baby',mikasaText:'Mikasa Bot is everyone\'s favorite Messenger GOAT bot. Multi-functional with elite commands, she ensures a top-tier experience with a strict "No 18+" command.',mikasaImage:'https://i.imgur.com/igiRnE0.jpeg',mikasaLink:'https://m.me/j/AbYhrDx5QWRQ54or/',mikasaButton:'Join Mikasa world'}},
  tools:{title:'Tools',route:'tools',icon:'fa-toolbox',type:'page',order:2,inNav:true,enabled:true,source:'file',file:'sections/tools.js',shadow:false,desc:'Weather, lyrics, downloader, live TV and more',schema:[],settings:{title:'Elite Tools',subtitle:'',folder:'saif'}},
  theme:{title:'Theme',route:'theme',icon:'fa-palette',type:'global',order:80,inNav:false,enabled:true,source:'file',file:'sections/theme.js',schema:[],settings:{brand:'SAIF ELITE',mode:'dark',toggle:true,gold:'#ffd700',fire1:'#ff6600',fire2:'#ff9900',bg:'#0c0b0a',surface:'#151312',text:'#f4f1ec'}},
  style:{title:'Style',route:'style',icon:'fa-swatchbook',type:'global',order:81,inNav:false,enabled:true,source:'file',file:'sections/style.js',schema:[],settings:{bodyFont:'Outfit',displayFont:'Syne',roundness:'soft',width:'normal'}},
  effects:{title:'Effects',route:'effects',icon:'fa-fire',type:'global',order:90,inNav:false,enabled:true,source:'file',file:'sections/effects.js',schema:[],settings:{rain:true,sparks:true,density:60}},
  music:{title:'Music',route:'music',icon:'fa-music',type:'global',order:91,inNav:false,enabled:true,source:'file',file:'sections/music.js',schema:[],settings:{url:'https://files.catbox.moe/oplblr.opus',volume:30}}
};

var MODS={},CODE={},nav=[],pageCtx=null,globalCtx={},currentRoute='',booted=false;

function makeCtx(id,meta,root){var clean=[];var ctx={meta:meta,root:root,host:root,settings:meta.settings||{},esc:esc,safeUrl:safeUrl,db:db,toast:toast,nav:nav,css:function(t){var st=document.createElement('style');st.setAttribute('data-mod',id);st.textContent=t;document.head.appendChild(st);clean.push(function(){st.remove()})},onDestroy:function(f){clean.push(f)}};ctx.site=siteAPI;ctx.__clean=clean;return ctx}
function destroyCtx(c){if(!c)return;(c.__clean||[]).forEach(function(f){try{f()}catch(e){console.warn(e)}})}
function showErr(r,e){console.error('[module]',e);r.innerHTML='<div class="page-err"><i class="fas fa-triangle-exclamation"></i><h3>This section could not load</h3><p>'+esc(e&&e.message?e.message:String(e))+'</p></div>'}
function execute(code,ctx){try{var fn=new Function('ctx','"use strict";return (async()=>{\n'+code+'\n})();');var p=fn(ctx);if(p&&typeof p.catch==='function')p.catch(function(e){showErr(ctx.root,e)})}catch(e){showErr(ctx.root,e)}}

function normIcon(i){i=String(i||'fa-cube').trim();if(/\s/.test(i))return i;if(i.indexOf('fa-')!==0)i='fa-'+i;return'fas '+i}
function buildNav(){
  var pages=Object.keys(MODS).map(function(id){return Object.assign({id:id},MODS[id])}).filter(function(m){return m.enabled!==false&&(m.type||'page')==='page'}).sort(function(a,b){return (a.order||0)-(b.order||0)});
  nav=pages.map(function(m){return{id:m.id,route:m.route||m.id,title:m.title||m.id,icon:normIcon(m.icon),desc:m.desc||'',inNav:m.inNav!==false}});
  renderNavUI();
}
function renderNavUI(){
  var shown=nav.filter(function(n){return n.inNav});
  $('#sideNav').innerHTML=shown.map(function(n){return'<a href="#/'+esc(n.route)+'" data-r="'+esc(n.route)+'"><i class="'+esc(n.icon)+'"></i>'+esc(n.title)+'</a>'}).join('')||'<div style="color:var(--muted);font-size:.86rem;padding:8px 14px">No pages yet.</div>';
  var bar=$('#tabbar'),grid=$('#sheetGrid');
  if(!shown.length){bar.innerHTML='';return}
  if(window.innerWidth>=900){bar.innerHTML='';return}
  var head=shown.slice(0,4),rest=shown.slice(4);
  bar.innerHTML=head.map(function(n){return'<a href="#/'+esc(n.route)+'" data-r="'+esc(n.route)+'"><i class="'+esc(n.icon)+'"></i><span>'+esc(n.title)+'</span></a>'}).join('')+(rest.length?'<button type="button" id="moreBtn"><i class="fas fa-ellipsis"></i><span>More</span></button>':'');
  grid.innerHTML=(rest.length?rest:shown).map(function(n){return'<a href="#/'+esc(n.route)+'" data-r="'+esc(n.route)+'"><i class="'+esc(n.icon)+'"></i><span>'+esc(n.title)+'</span></a>'}).join('');
  var mb=$('#moreBtn');if(mb)mb.onclick=function(){$('#sheet').hidden=false};
}
function paintNav(){$$('[data-r]').forEach(function(a){a.classList.toggle('on',a.dataset.r===currentRoute)})}

function resolve(route){route=String(route||'').replace(/^#\/?/,'').replace(/\/+$/,'');if(!route){var f=nav.find(function(n){return n.inNav})||nav[0];return f?f.route:''}var ex=nav.find(function(n){return n.route===route||n.id===route});return ex?ex.route:null}

function render(){
  var view=$('#view');
  var requested=resolve(location.hash);
  if(requested===null){if(pageCtx){destroyCtx(pageCtx);pageCtx=null}view.innerHTML='<div class="page-err"><i class="fas fa-compass"></i><h3>Page not found</h3><p>The address <b>#/'+esc(location.hash.replace(/^#\/?/,''))+'</b> does not exist.</p><p style="margin-top:14px"><a href="#/" style="display:inline-flex;padding:10px 18px;border-radius:12px;background:linear-gradient(135deg,var(--fire1),var(--fire2));color:#160800;font-weight:700">Go home</a></p></div>';currentRoute='';paintNav();return}
  var found=nav.find(function(n){return n.route===requested});if(!found)return;
  var id=found.id,m=MODS[id];if(!m)return;
  currentRoute=requested;
  if(pageCtx){destroyCtx(pageCtx);pageCtx=null}
  view.innerHTML='';var root=document.createElement('div');root.className='page';view.appendChild(root);
  var meta=Object.assign({id:id},m);var ctx=makeCtx(id,meta,root);pageCtx=ctx;
  var code=CODE[id];
  if(code){execute(code,ctx)}
  else if(m.file){
    fetch(m.file+'?v='+Date.now()).then(function(r){if(!r.ok)throw new Error('File not found: '+m.file);return r.text()})
      .then(function(txt){execute(txt,ctx)})
      .catch(function(e){var fb=srcOf(id);if(fb)execute(fb,ctx);else showErr(root,e)});
  } else {
    var fb=srcOf(id);if(fb)execute(fb,ctx);else root.innerHTML='<div class="page-err"><i class="fas fa-cube"></i><h3>'+esc(m.title||id)+'</h3><p>No code yet.</p></div>';
  }
  paintNav();window.scrollTo(0,0);
}

function runGlobals(){
  var host=$('#globals');
  Object.keys(globalCtx).forEach(function(id){destroyCtx(globalCtx[id])});globalCtx={};
  if(SAFE)return;
  var list=Object.keys(MODS).map(function(id){return Object.assign({id:id},MODS[id])}).filter(function(m){return m.enabled!==false&&m.type==='global'}).sort(function(a,b){return (a.order||0)-(b.order||0)});
  list.forEach(function(m){
    var box=document.createElement('div');box.setAttribute('data-gmod',m.id);host.appendChild(box);
    var ctx=makeCtx(m.id,Object.assign({id:m.id},m),box);globalCtx[m.id]=ctx;
    var code=CODE[m.id];
    if(code){execute(code,ctx);return}
    if(m.file){fetch(m.file+'?v='+Date.now()).then(function(r){return r.ok?r.text():''}).then(function(t){if(t)execute(t,ctx);else{var fb=srcOf(m.id);if(fb)execute(fb,ctx)}}).catch(function(){var fb=srcOf(m.id);if(fb)execute(fb,ctx)});return}
    var fb=srcOf(m.id);if(fb)execute(fb,ctx);
  });
}

function rebuild(){
  buildNav();runGlobals();
  if(!location.hash){var f=nav.find(function(n){return n.inNav})||nav[0];if(f)location.replace('#/'+f.route)}
  render();
}

SITE.child('modules').on('value',function(snap){
  var val=snap.val();MODS={};
  if(val&&typeof val==='object'){Object.keys(val).forEach(function(id){MODS[id]=val[id]||{}})}
  else{Object.keys(DEFAULT_MODULES).forEach(function(id){MODS[id]=JSON.parse(JSON.stringify(DEFAULT_MODULES[id]))})}
  rebuild();
  if(!booted){booted=true;$('#boot').hidden=true;$('#shell').hidden=false}
},function(err){
  console.warn('[site/modules]',err);
  if(!booted){Object.keys(DEFAULT_MODULES).forEach(function(id){MODS[id]=JSON.parse(JSON.stringify(DEFAULT_MODULES[id]))});rebuild();booted=true;$('#boot').hidden=true;$('#shell').hidden=false;toast('Offline mode: showing built-in defaults.')}
});

SITE.child('code').on('value',function(snap){
  var val=snap.val()||{},changed=false;
  Object.keys(val).forEach(function(id){if(typeof val[id]==='string'&&CODE[id]!==val[id]){CODE[id]=val[id];changed=true}});
  Object.keys(CODE).forEach(function(id){if(!(id in val)){delete CODE[id];changed=true}});
  if(changed&&booted){runGlobals();render()}
});

window.addEventListener('hashchange',render);
window.addEventListener('resize',function(){renderNavUI();paintNav()});
$('#modeBtn').addEventListener('click',function(){
  var c=document.documentElement.dataset.mode==='light'?'dark':'light';
  document.documentElement.dataset.mode=c;try{localStorage.setItem('themeMode',c)}catch(e){}
  $('#modeBtn').innerHTML='<i class="fas '+(c==='light'?'fa-sun':'fa-moon')+'"></i>';
});
$('#sheet').addEventListener('click',function(e){if(e.target.closest('[data-close]')||e.target.closest('a'))$('#sheet').hidden=true});
})();
</script>
</body>
</html>
